name: Fixed
description: >-
  Fixed (fixed.com.au) is a Brisbane, Australia based construction, refurbishment
  and facility-maintenance company specialising in the childcare sector. The
  business delivers centre refurbishments, reactive and preventative maintenance,
  emergency repairs, landscaping and outdoor play-space (yard) services for
  childcare and early-learning facilities across Australia, with licensed and
  inducted teams and 24/7 after-hours availability. It is a services trades
  business with a WordPress marketing website and no public developer program,
  API, SDK, or machine-readable surface. This entry was auto-created as a stub
  from a venture-portfolio match; that match is almost certainly a domain/name
  collision (see x-notes) and the profile is retained here as an enriched,
  no-API-surface company record.
